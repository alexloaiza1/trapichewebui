<div class="p-6"> <!-- Añadir padding general -->
    <h2 class="text-2xl font-semibold mb-4">Gestión de Empleados</h2>

    <!-- Botón Agregar (ejemplo de estilo) -->
    <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mb-4">
        Agregar Empleado
    </button>

    <hr class="mb-4">

    <h3 class="text-xl font-semibold mb-2">Lista de Empleados</h3>

    <div class="overflow-x-auto shadow-md sm:rounded-lg"> <!-- Contenedor para tabla responsive y sombra -->
        <table class="w-full text-sm text-left text-gray-500">
            <thead class="text-xs text-gray-700 uppercase bg-gray-100">
                <tr>
                    <th scope="col" class="px-6 py-3">Nombre</th>
                    <th scope="col" class="px-6 py-3">Cargo ID</th> <!-- Cambiado de Cargo a Cargo ID -->
                    <th scope="col" class="px-6 py-3">Fecha Contratación</th> <!-- Cambiado de Fecha Ingreso -->
                    <th scope="col" class="px-6 py-3">Salario</th> <!-- Añadido Salario -->
                    <th scope="col" class="px-6 py-3">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <!-- Usar *ngFor para iterar sobre la lista de empleados -->
                <tr *ngFor="let emp of empleados" class="bg-white border-b hover:bg-gray-50">
                    <td class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap">{{ emp.Nombre }}</td>
                    <td class="px-6 py-4">{{ emp.CargoID }}</td>
                    <td class="px-6 py-4">{{ emp.fechaIngreso | date:'yyyy-MM-dd' }}</td> <!-- Usar pipe date -->
                    <td class="px-6 py-4">{{ emp.Salario | number:'1.2-2' }}</td> <!-- Usar pipe number -->
                    <td class="px-6 py-4">
                        <!-- Botón Editar (ejemplo) -->
                        <button class="text-blue-600 hover:text-blue-900 mr-2">Editar</button>
                        <!-- Botón Eliminar -->
                        <button class="text-red-600 hover:text-red-900">Eliminar</button>
                    </td>
                </tr>
                <!-- Mensaje si no hay empleados -->
                <tr *ngIf="empleados.length === 0" class="bg-white border-b">
                    <td colspan="5" class="px-6 py-4 text-center text-gray-500">No hay empleados para mostrar.</td>
                    <!-- Ajustado colspan -->
                </tr>
            </tbody>
        </table>
    </div>
    <hr class="mt-4"> <!-- Añadido margen superior -->
</div>
